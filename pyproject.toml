[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipette_viz"
version = "1.1.0"
description = "Silicon Valley-grade Visualization & Personal Branding SDK for Classical ML, Deep Learning & Clinical XAI"
authors = [{ name = "Mateusz Jakubowski" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "numpy>=1.21.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://mateusz-jakubowski.ai.studio/"
Showroom = "https://from-pipette-to-python.ai.studio/"
Repository = "https://github.com/MatthewJakubowski/pipette-viz"
LinkedIn = "https://www.linkedin.com/in/mateuszjakubowski"
Kaggle = "https://www.kaggle.com/matthewjakubowski"
HuggingFace = "https://huggingface.co/matthewjakubowski"
X = "https://x.com/M_S_Jakubowski"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
pipette_viz = ["*.mplstyle"]
